name: Publish PDF Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live with XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-lang-portuguese \
            texlive-xetex \
            latexmk

      - name: Compile forallx.tex with XeLaTeX
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error forallx.tex

      - name: Fail on unresolved references
        run: |
          if grep -nE 'Reference .* undefined|There were undefined references' forallx.log; then
            echo 'Unresolved LaTeX references detected.'
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" forallx.pdf \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" forallx.pdf \
              --repo "${GITHUB_REPOSITORY}" \
              --title "forallx ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
